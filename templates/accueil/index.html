{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuafor - Beauté de proximité</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map.fullscreen {
            position: fixed;
            inset: 0;
            z-index: 3000;
        }
    </style>
</head>
<body>

    <header class="kuafor-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <span class="kuafor-logo">
                    <i class="fa-solid fa-scissors"></i> KUAFOR
                </span>
                <nav class="d-none d-md-flex gap-4">
                    <a href="{% url 'accueil:accueil' %}" class="text-decoration-none text-dark fw-semibold">Accueil</a>
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Messages</a>
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Reservations</a>
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Profil</a>
                </nav>
            </div>
        </div>
    </header>

<div class="hero-section">
    <video class="hero-video" autoplay muted loop playsinline>
        <source src="{% static 'video/vid.mp4' %}" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1>Trouvez votre artiste beauté au Cameroun</h1>
        <p>Réservez les meilleurs talents près de vous</p>

        <div class="search-card">
            <button class="btn btn-location w-100 mb-3" onclick="getLocation()">
                <i class="bi bi-geo-alt-fill"></i> UTILISER MA POSITION
            </button>
            <p id="location-text" class="text-muted small"></p>

            <select id="service" class="form-select mb-3">
                <option value="COIFFURE_H">Coiffure Homme</option>
                <option value="COIFFURE_F">Coiffure Femme</option>
                <option value="MAKEUP">Make-up</option>
                <option value="ONGLERIE">Onglerie</option>
            </select>

            <button class="btn btn-locate w-100" onclick="search()">
                <i class="bi bi-search"></i> LOCALISER
            </button>
        </div>
    </div>
</div>

<!-- Résultats -->
<div id="results-area" class="container py-4"
     style="display:none; position:fixed; inset:0; background:#fff; z-index:2000; overflow:auto;">
    <button onclick="closeResults()" class="btn btn-sm mb-2">← Retour</button>
    <div id="results-content"></div>
</div>

<!-- Bottom nav mobile -->
<nav class="bottom-nav">
    <a href="{% url 'accueil:accueil' %}" class="nav-link active">
        <i class="bi bi-house-door-fill"></i><span>Accueil</span>
    </a>
    <a href="#" class="nav-link">
        <i class="bi bi-chat-left-text"></i><span>Messages</span>
    </a>
    <a href="#" class="nav-link">
        <i class="bi bi-calendar-event"></i><span>Réservations</span>
    </a>
    <a href="#" class="nav-link">
        <i class="bi bi-person-circle"></i><span>Profil</span>
    </a>
</nav>

<script>
let userCoords = null;
let map = null;
let routeLayer = null;

/* 📏 Distance */
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;
    const a =
        Math.sin(dLat/2) ** 2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2) ** 2;
    return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
}

/* 🎨 Icônes */
const userIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/64/64113.png",
    iconSize: [40,40],
    iconAnchor: [20,40]
});

const salonIcon = L.icon({
    iconUrl: "https://cdn-icons-png.flaticon.com/512/2965/2965567.png",
    iconSize: [40,40],
    iconAnchor: [20,40]
});

/* 📍 Localisation */
function getLocation() {
        const statusText = document.getElementById('location-text');
        
        if (navigator.geolocation) {
            statusText.innerText = "📍 Recherche de votre position...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCoords = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    };
                    statusText.innerHTML = '<span class="text-success">✅ Position activée (Douala, CM)</span>';
                },
                (err) => {
                    statusText.innerHTML = '<span class="text-danger">❌ Erreur de géolocalisation</span>';
                    console.error(err);
                }
            );
        } else {
            statusText.innerText = "Votre navigateur ne supporte pas la géolocalisation";
        }
    }

/* 🔍 Recherche */
async function search() {
    if (!userCoords) return alert("Active ta position");
    document.getElementById('results-area').style.display = 'block';

    const service = document.getElementById('service').value;
    const res = await fetch(`/api/recherche/?lat=${userCoords.lat}&lng=${userCoords.lng}&category=${service}`);
    displayResults(await res.json());
}

/* 🗺️ Carte */
function displayResults(artistes) {
    document.getElementById('results-content').innerHTML = `
        <button class="btn btn-dark mb-2" onclick="toggleFullscreen()">📱 Plein écran</button>
        <div id="map" style="height:400px;"></div>
    `;

    if (map) map.remove();
    map = L.map('map').setView([userCoords.lat, userCoords.lng], 14);

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
        { maxZoom: 20 }
    ).addTo(map);

    L.marker([userCoords.lat, userCoords.lng], { icon: userIcon })
        .addTo(map)
        .bindPopup("Vous êtes ici");

    artistes.forEach(a => {
        if (!a.latitude) return;
        const dist = getDistance(userCoords.lat, userCoords.lng, a.latitude, a.longitude);

        L.marker([a.latitude, a.longitude], { icon: salonIcon })
            .addTo(map)
            .bindPopup(`
                <b>${a.nom_salon}</b><br>
                📏 ${dist} km<br>
                <button class="btn btn-sm btn-primary mt-1"
                    onclick="drawRoute(${a.latitude}, ${a.longitude})">
                    🧭 Itinéraire
                </button>
            `);
    });
}

/* 🧭 Itinéraire */
async function drawRoute(lat, lng) {
    if (routeLayer) map.removeLayer(routeLayer);

    const res = await fetch(
        `https://router.project-osrm.org/route/v1/driving/${userCoords.lng},${userCoords.lat};${lng},${lat}?geometries=geojson`
    );
    const data = await res.json();

    routeLayer = L.geoJSON(data.routes[0].geometry).addTo(map);
    map.fitBounds(routeLayer.getBounds());
}

/* 📱 Plein écran */
function toggleFullscreen() {
    document.getElementById('map').classList.toggle('fullscreen');
    map.invalidateSize();
}

function closeResults() {
    document.getElementById('results-area').style.display = 'none';
}
</script>

</body>
</html>
