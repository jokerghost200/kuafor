{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuafor - Beauté de proximité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="kuafor-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <span class="kuafor-logo">
                    <i class="fa-solid fa-scissors"></i> KUAFOR
                </span>
                <nav class="d-none d-md-flex gap-4">
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Accueil</a>
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Messages</a>
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Reservations</a>
                    <a href="#" class="text-decoration-none text-dark fw-semibold">Profil</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero Section avec Vidéo Background -->
    <div class="hero-section">
        <!-- Vidéo en arrière-plan -->
        <video class="hero-video" autoplay muted loop playsinline>
            <source src="{% static 'video/vid.mp4' %}" type="video/mp4">
        </video>
        
        <!-- Overlay avec gradient -->
        <div class="hero-overlay"></div>

        <!-- Contenu Hero -->
        <div class="hero-content">
            <h1>Trouvez votre artiste beauté au Cameroun</h1>
            <p>Réservez les meilleurs talents directement à votre domicile Service rapide, professionnel et personnalisé</p>

            <!-- Search Card -->
            <div class="search-card">
                <button class="btn btn-location w-100 mb-4" onclick="getLocation()">
                    <i class="bi bi-geo-alt-fill"></i> UTILISER MA POSITION
                </button>
                <p id="location-text" class="text-muted small"></p>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">SERVICE RECHERCHÉ</label>
                    <select id="service" class="form-select">
                        <option value="COIFFURE_H">Coiffure Homme</option>
                        <option value="COIFFURE_F">Coiffure Femme</option>
                        <option value="MAKEUP">Make-up professionnel</option>
                        <option value="ONGLERIE">Onglerie</option>
                    </select>
                </div>

                <button class="btn btn-locate w-100" onclick="search()">
                    <i class="bi bi-search"></i> LOCALISER
                </button>
            </div>
        </div>
    </div>

    <!-- Results Area -->
    <div id="results-area" class="container py-5" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.98); z-index: 2000; overflow-y: auto; padding-top: 100px;">
        <button onclick="closeResults()" class="btn btn-sm mb-3" style="background: var(--kuafor-gradient); color: white; position: sticky; top: 20px;">
            <i class="bi bi-arrow-left"></i> Retour
        </button>
        <div id="results-content"></div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-link active">
            <i class="bi bi-house-door-fill"></i>
            <span>Accueil</span>
        </a>
        <a href="#" class="nav-link">
            <i class="bi bi-chat-left-text"></i>
            <span>Messages</span>
        </a>
        <a href="#" class="nav-link">
            <i class="bi bi-calendar-event"></i>
            <span>Réservations</span>
        </a>
        <a href="#" class="nav-link">
            <i class="bi bi-person-circle"></i>
            <span>Profil</span>
        </a>
    </nav>

    <script>
    let userCoords = null;

    // Fonction pour récupérer la position
    function getLocation() {
        const statusText = document.getElementById('location-text');
        
        if (navigator.geolocation) {
            statusText.innerText = "📍 Recherche de votre position...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCoords = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    };
                    statusText.innerHTML = '<span class="text-success">✅ Position activée (Douala, CM)</span>';
                },
                (err) => {
                    statusText.innerHTML = '<span class="text-danger">❌ Erreur de géolocalisation</span>';
                    console.error(err);
                }
            );
        } else {
            statusText.innerText = "Votre navigateur ne supporte pas la géolocalisation";
        }
    }

    // Fonction de recherche
    async function search() {
        const service = document.getElementById('service').value;
        const resultsArea = document.getElementById('results-area');

        if (!userCoords) {
            alert("Veuillez d'abord cliquer sur 'UTILISER MA POSITION'");
            return;
        }

        resultsArea.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status"></div></div>';
        resultsArea.style.display = 'block';

        try {
            const response = await fetch(`/api/recherche/?lat=${userCoords.lat}&lng=${userCoords.lng}&category=${service}`);
            const data = await response.json();
            displayResults(data);
        } catch (error) {
            resultsArea.innerHTML = '<p class="text-danger text-center">Erreur de connexion au serveur Kuafor</p>';
        }
    }

    // Affichage des résultats
    function displayResults(artistes) {
        const resultsArea = document.getElementById('results-area');
        const resultsContent = document.getElementById('results-content');
        resultsContent.innerHTML = '';

        // Afficher la zone de résultats
        resultsArea.style.display = 'block';

        if (artistes.length === 0) {
            resultsContent.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-search" style="font-size: 4rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">Aucun artiste disponible à proximité pour ce service.</p>
                </div>
            `;
            return;
        }

        let html = '<div class="row">';
        artistes.forEach(artiste => {
            const photo = artiste.photo_principale || 'https://via.placeholder.com/400x300?text=Kuafor';
            
            html += `
                <div class="col-12 col-md-6 col-lg-4 mb-4">
                    <div class="card result-card">
                        <img src="${photo}" class="card-img-top" alt="${artiste.nom_salon}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="card-title mb-0 fw-bold">${artiste.nom_salon}</h5>
                                <span class="badge-distance">${artiste.distance} km</span>
                            </div>
                            <p class="card-text text-muted small text-truncate">${artiste.description}</p>
                            <button class="btn btn-view-catalog w-100 mt-3">
                                <i class="bi bi-eye"></i> VOIR LE CATALOGUE
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        resultsContent.innerHTML = html;
    }

    // Fonction pour fermer les résultats
    function closeResults() {
        document.getElementById('results-area').style.display = 'none';
    }
    </script>
</body>
</html>
